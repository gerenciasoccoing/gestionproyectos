services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: gestionproyectos
      POSTGRES_USER: gestionproyectos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestionproyectos"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: postgres://gestionproyectos:${POSTGRES_PASSWORD}@db:5432/gestionproyectos
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      UPLOAD_DIR: uploads
      CORS_ORIGIN: "*"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
