services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: gestionproyectos
      POSTGRES_USER: gestionproyectos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestionproyectos"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: always
    environment:
      PORT: 4000
      # Conexión restringida (Capa 2/RLS): la que atiende peticiones HTTP reales, con un rol de
      # base de datos que NO es dueño de las tablas (ver backend/src/utils/postSyncFixups.js#ensureAppDbRole
      # — el rol se crea solo, en el primer arranque, con esta misma contraseña).
      DATABASE_URL: postgres://gestionproyectos_app:${APP_DB_PASSWORD}@db:5432/gestionproyectos
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      # Conexión de administración (dueña de las tablas): solo para sync/DDL/migraciones y scripts
      # de mantenimiento (seed.js, createPlatformAdmin.js) — mismas credenciales que siempre tuvo
      # DATABASE_URL antes de separar los dos roles.
      ADMIN_DATABASE_URL: postgres://gestionproyectos:${POSTGRES_PASSWORD}@db:5432/gestionproyectos
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 8h
      UPLOAD_DIR: uploads
      CORS_ORIGIN: "*"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      LOROAPI_BASE_URL: ${LOROAPI_BASE_URL}
      LOROAPI_API_KEY: ${LOROAPI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_VISION_MODEL: ${ANTHROPIC_VISION_MODEL}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      INVENTORY_CONFIRMATION_HOURS: ${INVENTORY_CONFIRMATION_HOURS}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      PLATFORM_ADMIN_NOTIFICATION_EMAIL: ${PLATFORM_ADMIN_NOTIFICATION_EMAIL}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Certificados de Let's Encrypt del host (emitidos por certbot fuera de Docker), montados
      # de solo lectura para que nginx los sirva. Ver nginx.conf.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  db_data:
  uploads_data:
