# Cualquier host (dominio, www, o la IP directa) se redirige a la versión HTTPS del dominio
# canónico. No se distingue $host acá para no tener que mantener casos aparte: todo termina en
# el mismo lugar.
server {
    listen 80;
    server_name _;
    return 301 https://ergyproject.com$request_uri;
}

server {
    listen 443 ssl;
    server_name ergyproject.com www.ergyproject.com;

    ssl_certificate /etc/letsencrypt/live/ergyproject.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ergyproject.com/privkey.pem;

    # www es un alias: todo el tráfico real vive en el dominio raíz.
    if ($host = www.ergyproject.com) {
        return 301 https://ergyproject.com$request_uri;
    }

    # Permite adjuntar varias fotos de avance en una sola petición multipart.
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
